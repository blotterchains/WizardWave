<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wizard Wave</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="logo-wrapper">
    <!-- Rotating Owl Disk-->
    <svg class="owl" viewBox="0 0 64 64" width="60" height="60">
      <circle cx="32" cy="32" r="28" fill="#ff6fa3" stroke="#ff4d99" stroke-width="2"/>
      <circle cx="22" cy="28" r="6" fill="#fff"/>
      <circle cx="42" cy="28" r="6" fill="#fff"/>
      <circle cx="22" cy="28" r="3" fill="#333"/>
      <circle cx="42" cy="28" r="3" fill="#333"/>
      <polygon points="30,36 34,36 32,40" fill="#ffd700"/>
      <g class="sparkles">
        <circle cx="10" cy="10" r="2" fill="#fff9c4"/>
        <circle cx="54" cy="14" r="2" fill="#fff9c4"/>
        <circle cx="50" cy="50" r="2" fill="#fff9c4"/>
        <circle cx="14" cy="54" r="2" fill="#fff9c4"/>
      </g>
    </svg>
  </div>
  <h1>Wizard Wave</h1>
</header>

<div class="controls">
  <select id="categoryDropdown">
    <option value="all">All Categories</option>
  </select>
  <input type="text" id="searchBox" placeholder="Search stations...">
</div>

<div class="station-list-wrap" id="stationList"></div>

<div id="stationName">Loading…</div>
<div id="stationQuality"></div>

<div class="slider-wrap">
  <input id="stationSlider" type="range" min="0" max="0" value="0">
  <div class="station-count" id="stationIndexText"></div>
</div>

<audio id="player" controls autoplay></audio>

<script src="js/app.js"></script>
</body>
</html>
